# Runs the data pipeline every morning and publishes any new EU decisions.
name: Daily update
on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new decisions from EUR-Lex and Eurostat
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: AI headlines & summaries
        run: python update.py
      - name: Publish if anything changed
        run: |
          git config user.name "follow-through-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json ai_cache.json decision section goals.html coming.html about.html sitemap.xml robots.txt feed.xml
          git diff --cached --quiet || git commit -m "Daily update: $(date -u +%F)"
          git push
